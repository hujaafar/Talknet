name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript
        run: |
          node --check static/js/app.js
          node --check static/js/theme.js
          node --check static/js/experience.mjs
      - name: Test motion and editor behavior
        run: node --test tests/*.test.mjs
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Race and integration tests
        run: go test -race -cover ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build release
        run: go build -trimpath ./...
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up -d --build --wait
      - name: HTTP smoke check
        run: curl --fail http://localhost:8088/healthz
      - name: Shutdown
        if: always()
        run: docker compose down
