name: Report a bug
description: Help reproduce an unexpected result in Talknet.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open a discussion…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Browser and version, operating system, Docker or native Go"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or relevant error
      description: Use fictional data and omit passwords, cookies, and database contents.
