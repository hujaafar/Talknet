services:
  talknet:
    build: .
    ports:
      - "127.0.0.1:${TALKNET_PORT:-8088}:8080"
    environment:
      TALKNET_SECURE_COOKIES: "${TALKNET_SECURE_COOKIES:-false}"
    volumes:
      - talknet-data:/app/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  talknet-data:
